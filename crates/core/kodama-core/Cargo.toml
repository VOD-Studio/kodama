[package]
name = "kodama-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
schemars = { version = "1", optional = true }
kodama-term = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "fast"] }

[features]
schema = ["dep:schemars", "kodama-term/schema"]

[lints]
workspace = true

