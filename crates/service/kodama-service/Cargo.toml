[package]
name = "kodama-service"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kodama-core = { workspace = true }
kodama-store = { workspace = true }
kodama-issuer = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["std"] }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
