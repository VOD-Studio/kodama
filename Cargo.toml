[workspace]
resolver = "2"
# 目录即分层：crates/<层>/<crate>，层的含义与依赖方向见 docs/architecture.md，由 scripts/check/check-arch.mjs 校验
members = ["crates/*/*"]

[workspace.package]
edition = "2021"
version = "0.2.0"
publish = false
license = "MIT"

[workspace.dependencies]
# workspace 内的 crate：路径只在这里声明一次，成员一律写 `pet-xxx = { workspace = true }`
pet-core = { path = "crates/core/pet-core" }
pet-term = { path = "crates/core/pet-term" }
pet-store = { path = "crates/service/pet-store" }
pet-issuer = { path = "crates/service/pet-issuer" }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[workspace.lints.clippy]
float_arithmetic = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
