# cargo-deny：本地 make deny；CI 的 Lint 作业逐 PR 检查 bans、licenses、sources，
# security.yml 每周检查 advisories（RustSec 安全公告）。

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# 产物以 MIT 分发，依赖只接受宽松许可；新增许可须评审后加入
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  # ISC：条款与 MIT 等价的宽松许可。rustls 的证书校验（rustls-webpki、untrusted）与 ring 使用，
  # CLI 的账号模式（HTTPS）离不开它们（2026-10 评审加入）
  "ISC",
]
confidence-threshold = 0.93

# 只在个别目标上出现、不进入任何发布产物的依赖，逐个列出理由
[[licenses.exceptions]]
# 根证书数据。rustls-platform-verifier 只在 wasm32 上依赖它，pet-cli 从不为 wasm32 构建；
# 原生构建使用操作系统的信任库
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# workspace 内的 crate 不发布到 crates.io（publish = false）
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace 内部的 path 依赖不写版本号，不算通配
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
