# 依赖自动更新：每月一次；minor/patch 合并为一个 PR，major 单独开 PR 便于评估。
# 仓库只允许 rebase 合并，Dependabot 的提交信息会原样进入 main，前缀决定是否发版：
#   cargo 依赖编译进所有产物（SDK、CLI、服务镜像），用 fix(deps) 让更新随补丁版本发布；
#   SDK 的 npm 依赖只是开发工具、Actions 与镜像只影响 CI 与构建，用 chore/ci，不触发发版。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: fix(deps)
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # 必须与 CI、docker/dev.Dockerfile 安装的 wasm-bindgen-cli 同步升级（scripts/check/version.mjs 校验），手动处理
      - dependency-name: wasm-bindgen

  - package-ecosystem: npm
    directory: /packages/kodama-sdk
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    ignore:
      # 开发镜像的 Node 必须与 CI 一致；主版本升级需要同时改 CI、开发镜像与 SDK 的 engines，手动处理
      - dependency-name: node
        update-types: ["version-update:semver-major"]
