name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 发版 PR 由 GITHUB_TOKEN 创建,不会自动触发 CI;release.yml 会手动触发
  workflow_dispatch:

concurrency:
  group: pet-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: 0.2.129
  CARGO_DENY_VERSION: 0.20.2
  ACTIONLINT_VERSION: 1.7.12

jobs:
  runner:
    name: Pick runner
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  # 静态检查,不依赖其他作业;本地等价于 make lint
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy, rustfmt
      # 必须排在所有 cargo 命令之前：后面的 clippy 与构建会悄悄改写锁文件，掩盖没提交的更新
      - name: Cargo.lock is committed up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      # install-action 收录的 actionlint 版本滞后，直接下载官方发布并校验 checksum（与 docker/dev.Dockerfile 同源）
      - name: Install actionlint
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: make fmt-check
      - run: make clippy
      - name: Architecture (layout, layers, dependency directions, no_std core)
        run: make check-arch
      - run: make check-versions
      - run: make lint-scripts
      - run: make lint-workflows
      # 安全公告由 security.yml 定时检查，避免新公告让无关 PR 突然失败
      - name: Dependencies (licenses, sources, bans)
        run: make deny DENY_CHECKS="bans licenses sources"

  core:
    name: Core, storage and schema
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pet
          POSTGRES_DB: pet
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Tests (SQLite and Postgres contract)
        env:
          PET_TEST_PG_URL: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} user=postgres password=pet dbname=pet
        run: cargo test --workspace -- --include-ignored
      - name: Native, Node and web WebAssembly agree
        run: make three-end
      - name: Service end to end (SQLite and Postgres)
        env:
          PET_TEST_PG_URL: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} user=postgres password=pet dbname=pet
        run: make e2e-pg
      - name: Service image builds and answers
        run: make image-smoke
      - name: Schema, types and docs match the Rust types
        run: make schema-check
      - name: SDK web rendering (lifecycle, accessibility)
        run: make sdk-test
      - name: Real TTY behavior
        run: make tty

  consumers:
    name: External consumption
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: packages/pet-sdk
      - name: Chrome
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
      - name: TanStack Start SSR and hydration
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_FLAGS: --no-sandbox
        run: sh tests/consumers/tanstack-start/run.sh
      - name: CLI release archive outside the repository
        run: sh tests/consumers/cli-archive/run.sh
      - name: Node terminal embedding
        run: sh tests/consumers/node-embed/run.sh
      - name: Rust host embedding
        run: sh tests/consumers/rust-host/run.sh

  platforms:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 官方 runner 上可用的 Unix 目标；Windows 需要单独实现终端处理，尚未纳入。
        os: [ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Tests (SQLite contract, rules, protocol)
        run: cargo test --workspace
      - name: Release binary and real TTY behavior
        run: make tty
      - name: Rust host embedding
        run: sh tests/consumers/rust-host/run.sh
