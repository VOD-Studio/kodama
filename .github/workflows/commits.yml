name: Commits

# release-please 从 main 上的提交推导版本号与 CHANGELOG。仓库只允许 Rebase and merge：
# PR 里的每个提交原样进入 main，历史完整保留，每个 feat、fix 各成一条 CHANGELOG。
# squash（会把历史压成一个提交）与 merge commit（会带上 PR 标题，同一改动被记两次）都已关闭。
# 发版 PR 由 GITHUB_TOKEN 创建，不会触发 pull_request；release.yml 以 workflow_dispatch 对其分支补跑一次。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    # 必需检查：每个提交都会原样进入 main
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every commit follows Conventional Commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.ref_name }}
          # <type>(<scope>)?!?: <描述>
          PATTERN: '^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ]'
        run: |
          headlines=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[].messageHeadline')
          printf '%s\n' "$headlines"
          bad=$(printf '%s\n' "$headlines" | grep -Ev "$PATTERN" || true)
          [ -z "$bad" ] && exit 0
          {
            echo "这些提交不符合 Conventional Commits，而它们会原样进入 main："
            printf '  %s\n' "$bad"
            echo "格式：<type>(<scope>)?: <描述>，破坏性变更在冒号前加 !；type 为"
            echo "feat fix perf refactor docs style test build ci chore revert。"
            echo "用 git rebase -i 整理或改写提交信息后强推本分支。合并提交（Merge …）也不允许，请 rebase 到 main。"
          } >&2
          exit 1
