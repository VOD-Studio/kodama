name: Package

# 构建并验收发布产物，以 artifact 交出：npm 的 @violetjs/kodama（SDK）与各平台的 kodama 归档。
# 这里的作业接触不到任何发布凭据；发布由 release.yml 完成（npm 环境、GitHub Release、GHCR）。
# PR 上只做 dry-run 与验收；发版时由 release.yml 调用并传入版本。
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "crates/core/kodama-core/**"
      - "crates/core/kodama-term/**"
      - "crates/runtimes/kodama-wasm/**"
      - "crates/runtimes/kodama/**"
      - "packages/**"
      - "scripts/release/**"
      - "scripts/check/version.mts"
      - "tests/consumers/cli-archive/**"
      - "tests/tty/**"
      - ".github/workflows/package.yml"
  workflow_call:
    inputs:
      version:
        description: 发布的版本号,不带 v 前缀
        type: string
        required: true
      ref:
        description: 要构建的 git 引用(发版时为标签)
        type: string
        default: ""

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: 0.2.129
  VERSION: ${{ inputs.version || '0.0.0-dryrun' }}

jobs:
  sdk:
    name: "@violetjs/kodama"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Version files agree with the tag
        if: inputs.version
        run: node scripts/check/version.mts check "v$VERSION"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: packages/kodama-sdk
      - run: packages/kodama-sdk/build.sh
      - name: Pack and dry-run
        run: |
          mkdir -p "$RUNNER_TEMP/tgz"
          npm pack ./packages/kodama-sdk --pack-destination "$RUNNER_TEMP/tgz"
          scripts/release/npm-publish.sh "$RUNNER_TEMP"/tgz/*.tgz dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-sdk
          path: ${{ runner.temp }}/tgz/*.tgz
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 与 docs/operations/distribution.md 的支持平台一致。Linux 用 musl 静态链接，不依赖发行版的 glibc 版本；
        # 每个归档都在构建它的平台上验收（真实 TTY），不交叉编译未经验证的平台。
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      # 账号模式的 TLS（rustls 的 ring）含 C 代码：musl 目标用 musl-gcc 编译
      - name: Install the musl C toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build the release archive
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/release/package-cli.sh "$RUNNER_TEMP/dist" "$TARGET"
      - name: Archive runs outside the repository
        env:
          TARGET: ${{ matrix.target }}
          # 发版时核对 kodama --version 与标签一致
          VERSION: ${{ inputs.version }}
        run: sh tests/consumers/cli-archive/run.sh "$RUNNER_TEMP/dist/kodama-$TARGET.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
