name: Release

# 合并到 main 后由 release-please 维护「发版 PR」(版本号、CHANGELOG)。
# 合并发版 PR 会打标签、建 GitHub Release,并在同一个工作流里发布全部产物:
#   @violetjs/pet       → npm(npm 环境,人工批准)
#   pet-cli 各平台归档   → 该 GitHub Release 的附件,带 SHA256SUMS 与构建来源证明
#   pet-service 镜像     → ghcr.io/vod-studio/pet-service,多架构,带构建来源证明
# 发布放在这里而不是监听 release 事件:GITHUB_TOKEN 创建的 Release 不会触发其他工作流。
# package.yml 的构建作业接触不到凭据;NPM_TOKEN 只配置在 npm 环境里,只有 npm 作业能读到。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/vod-studio/pet-service

# release-please 会改写 git 状态,串行排队,不取消进行中的 run
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please 只改 Cargo.toml，Cargo.lock 里各 crate 的版本要另行同步；
      # 它的 extra-files 对 Cargo.lock 的 [[package]] 数组不生效。
      - name: Check out the release PR branch
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
          path: release-branch
      - name: Sync Cargo.lock on the release PR
        if: steps.rp.outputs.prs_created == 'true'
        working-directory: release-branch
        run: |
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock 已是最新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 同步 Cargo.lock 的 crate 版本" Cargo.lock
          git push
      # GITHUB_TOKEN 创建或更新的 PR 不会触发 CI,而合并需要 CI 状态;
      # 手动对发版分支触发一次,检查结果会挂在该提交上。提交信息检查同理。
      - name: Run CI on the release PR
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run commits.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      ref: ${{ needs.release-please.outputs.tag_name }}

  npm:
    name: Publish to npm
    needs: [release-please, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 环境限制只有 main 能触发,并要求人工批准;npm 的版本一旦发布不能重发
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-sdk
          path: pkgs
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/npm-publish.sh "pkgs/violetjs-pet-$VERSION.tgz" publish

  cli:
    name: CLI release assets
    needs: [release-please, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum pet-cli-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pet-cli-*.tar.gz
      # 重跑时覆盖同名附件;附件名不带版本号,releases/latest/download/ 链接长期有效
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # 每个架构在原生 runner 上构建、冒烟测试后按摘要推送,再由 image 作业合成多架构清单;
  # 不用 QEMU 模拟,Rust 的 release 构建在模拟下会慢一个数量级。
  image-build:
    name: Service image (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pet-service:smoke
      - run: sh scripts/smoke-service-image.sh pet-service:smoke
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 与上一步同一份构建缓存,只是改为按摘要推送
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  image:
    name: Service image
    needs: [release-please, image-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
      - name: Create the multi-arch manifest
        id: manifest
        working-directory: digests
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          tags=$(jq -r '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=""
          for d in *; do refs="$refs $IMAGE@sha256:$d"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
